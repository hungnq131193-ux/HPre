name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  # A main-branch run may be mid-release (tag pushed, release not yet created); never cancel it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Java 17
        uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4.4.2

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Test, lint and compile app and instrumentation APKs
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --no-daemon

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run deterministic reliability UI tests
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: >-
            test_status=0;
            ./gradlew connectedDebugAndroidTest
            '-Pandroid.testInstrumentationRunnerArguments.class=com.hpre.app.ui.common.ErrorPaneTest,com.hpre.app.ui.search.SearchScreenTest#raw_network_failure_shows_retry_and_recovers,com.hpre.app.ui.search.SearchScreenTest#pagination_failure_shows_inline_footer_and_retry_recovers,com.hpre.app.ui.library.LibraryScreenTest#create_playlist_failure_keeps_dialog_open_with_error,com.hpre.app.ui.library.LibraryScreenTest#settings_screen_toggles_and_choices_persist_state,com.hpre.app.ui.watch.WatchScreenTest#watch_screen_shows_error_pane_and_retries_on_stream_failure,com.hpre.app.ui.watch.WatchScreenTest#watch_screen_controls_dispatch_play_pause_and_seek,com.hpre.app.ui.watch.WatchScreenTest#comments_section_and_long_comment_can_expand_and_collapse,com.hpre.app.navigation.NavigationFlowTest#replacing_related_watch_releases_old_entry_and_keeps_source_destination'
            --no-daemon --max-workers=2 || test_status=$?;
            if [ "$test_status" -ne 0 ]; then
            mkdir -p app/build/reports/ui-failures;
            adb pull /sdcard/Download/hpre-watch-controls-failure.png app/build/reports/ui-failures/ || true;
            fi;
            exit "$test_status"

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: android-verification-reports
          path: |
            app/build/reports/tests/
            app/build/reports/androidTests/
            app/build/reports/lint-results-debug.*
            app/build/reports/ui-failures/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Decide next version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          latest=$(git tag -l 'v*' | sort -V | tail -1)
          if [ -n "$latest" ] && [ "$EVENT_NAME" = push ] && git diff --quiet "$latest" HEAD -- app/ gradle/; then
            echo "No app/ or gradle/ changes since $latest; nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          file_vn=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          file_vc=$(grep -oP 'versionCode = \K\d+' app/build.gradle.kts)
          tag_vn=${latest#v}; tag_vn=${tag_vn:-0.0.0}
          tag_vc=0
          [ -n "$latest" ] && tag_vc=$(git show "$latest:app/build.gradle.kts" | grep -oP 'versionCode = \K\d+')
          max_vn=$(printf '%s\n%s\n' "$file_vn" "$tag_vn" | sort -V | tail -1)
          new_vn=$(awk -F. '{printf "%d.%d.%d", $1, $2, $3 + 1}' <<<"$max_vn")
          new_vc=$(( (file_vc > tag_vc ? file_vc : tag_vc) + 1 ))
          echo "Releasing $new_vn ($new_vc), previous tag ${latest:-none}"
          {
            echo "skip=false"
            echo "name=$new_vn"
            echo "code=$new_vc"
            echo "tag=v$new_vn"
            echo "previous=$latest"
          } >> "$GITHUB_OUTPUT"

      - name: Bump version
        if: steps.version.outputs.skip == 'false'
        env:
          VN: ${{ steps.version.outputs.name }}
          VC: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          sed -i "s/versionCode = [0-9]*/versionCode = $VC/; s/versionName = \"[^\"]*\"/versionName = \"$VN\"/" app/build.gradle.kts
          sed -i \
            -e "s/fun release_version_is_[0-9_]*_code_[0-9]*_and_shrinks_resources/fun release_version_is_${VN//./_}_code_${VC}_and_shrinks_resources/" \
            -e "s/assertEquals(\"[^\"]*\", BuildConfig.VERSION_NAME)/assertEquals(\"$VN\", BuildConfig.VERSION_NAME)/" \
            -e "s/assertEquals([0-9]*, BuildConfig.VERSION_CODE)/assertEquals($VC, BuildConfig.VERSION_CODE)/" \
            app/src/test/java/com/hpre/app/BuildConfigurationTest.kt
          git diff --stat

      - name: Set up Java 17
        if: steps.version.outputs.skip == 'false'
        uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        if: steps.version.outputs.skip == 'false'
        uses: gradle/actions/setup-gradle@v4.4.2

      - name: Build signed release APK
        if: steps.version.outputs.skip == 'false'
        env:
          HPRE_KEYSTORE_BASE64: ${{ secrets.HPRE_KEYSTORE_BASE64 }}
          HPRE_SIGNING_STORE_PASSWORD: ${{ secrets.HPRE_SIGNING_STORE_PASSWORD }}
          HPRE_SIGNING_KEY_ALIAS: ${{ secrets.HPRE_SIGNING_KEY_ALIAS }}
          HPRE_SIGNING_KEY_PASSWORD: ${{ secrets.HPRE_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export HPRE_SIGNING_STORE_FILE="$RUNNER_TEMP/hpre-release.jks"
          echo "$HPRE_KEYSTORE_BASE64" | base64 -d > "$HPRE_SIGNING_STORE_FILE"
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --tests com.hpre.app.BuildConfigurationTest assembleRelease --no-daemon
          rm -f "$HPRE_SIGNING_STORE_FILE"

      - name: Commit, tag and publish release
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VN: ${{ steps.version.outputs.name }}
          TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          set -euo pipefail
          git config user.name "hpre-bot"
          git config user.email "hpre-bot@users.noreply.github.com"
          git add app/build.gradle.kts app/src/test/java/com/hpre/app/BuildConfigurationTest.kt
          git commit -m "chore(release): $VN [skip ci]"
          git tag "$TAG"
          git push origin HEAD:main "refs/tags/$TAG"

          apk="HPre-$TAG-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" | tr 'a-f' 'A-F' > "$apk.sha256"
          {
            echo "Tự động build từ main."
            echo
            if [ -n "$PREVIOUS" ]; then
              git log --no-merges --format='- %s' "$PREVIOUS..HEAD~1"
            fi
          } > release-notes.md
          gh release create "$TAG" --title "HPre $VN" --notes-file release-notes.md "$apk" "$apk.sha256"

      - name: Upload APK artifact
        if: steps.version.outputs.skip == 'false'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: HPre-${{ steps.version.outputs.tag }}-release
          path: HPre-*-release.apk*
